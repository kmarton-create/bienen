<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bee Yard Databank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --dk:#2b1a0c; --wood:#8b5a2b; --wood2:#7a4e24; --woodhi:#b07a3e; --honey:#f2c230; --honeydk:#b8860b;
  --parch:#f6e7b8; --parch2:#ecd89e; --ink:#2b1a0c; --muted:#7a5230; --wax:#fff1c2; --bgc:#16301d; --leaf:#3f7a3a;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bgc:#0f2414; } }
:root[data-theme="dark"]{ --bgc:#0f2414; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bgc)}
body{font-family:"VT323","Courier New",monospace;font-size:22px;line-height:1.2;color:var(--ink)}

#track{position:fixed;top:0;left:0;height:100%;width:300%;display:flex;transition:transform .45s steps(9),filter .25s steps(4)}
.scn{width:33.3334%;height:100%;flex:none;display:block}
body.modal #track{filter:blur(5px) brightness(.55) saturate(.8)}
body.modal.boxmode #track{filter:none}
body.boxmode .backdrop{justify-content:flex-end}
body.boxmode .shadow{width:min(360px,100%)}
body.boxmode .body{padding:10px 12px}
body.boxmode .panel{padding:4px 8px 6px}
body.boxmode .inv-row{gap:8px}
body.boxmode .inv-name{font-size:21px}
body.boxmode .sq{width:30px;height:30px;font-size:11px}
body.boxmode .qty b{min-width:30px;font-size:11px}
body.boxmode .titlebar span{font-size:12px}
body.boxmode .status span:last-child{display:none}
body.boxmode #wx{display:none}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:50px;height:58px;padding:2px;cursor:pointer;z-index:2;background:var(--wood);border:4px solid var(--dk);box-shadow:inset -4px -4px 0 var(--wood2),inset 4px 4px 0 var(--woodhi),5px 5px 0 #0009}
.nav.prev{left:calc(10px + env(safe-area-inset-left,0px))}
.nav.next{right:calc(10px + env(safe-area-inset-right,0px))}
.nav svg{width:100%;height:100%;display:block}
.nav:hover svg,.nav:focus-visible svg{transform:scale(1.08)}
.nav[hidden],body.modal .nav{display:none}
@media (max-height:500px){.nav{width:40px;height:46px;padding:1px}}
.hs{fill:transparent;stroke:transparent;stroke-width:6;cursor:pointer;outline:none}
.hs:hover,.hs:focus-visible{fill:#fff2;stroke:var(--honey);stroke-dasharray:14 8;animation:march .6s steps(4) infinite}
@keyframes march{to{stroke-dashoffset:-22}}

/* popup: wooden pixel frame */
.backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
body.modal .backdrop{display:flex}
.shadow{width:min(780px,100%);max-height:100%;display:flex;filter:drop-shadow(10px 10px 0 #0009);animation:pop .18s steps(3)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.notch{clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px))}
.win{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--dk);padding:4px}
.win-in{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 10px 6px;
  background:repeating-linear-gradient(0deg,var(--wood) 0 10px,var(--wood2) 10px 12px,var(--wood) 12px 22px,var(--woodhi) 22px 24px)}
.titlebar{display:flex;align-items:center;gap:10px;background:var(--honey);border:4px solid var(--dk);
  box-shadow:inset -4px -4px 0 var(--honeydk),inset 4px 4px 0 #ffe27a;padding:8px 8px 8px 12px;margin-bottom:8px}
.titlebar .sw{width:22px;height:22px;border:3px solid var(--dk);flex:none;box-shadow:inset -3px -3px 0 #0004,inset 3px 3px 0 #fff5}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tt small{font-size:19px;font-family:"VT323",monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar span{font-family:"Press Start 2P",monospace;font-size:13px;color:var(--dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}
.xbtn{width:34px;height:32px;flex:none;background:var(--dk);color:var(--honey);border:0;cursor:pointer;font-family:"Press Start 2P",monospace;font-size:12px;padding:0}
.xbtn:hover{background:#4a2e14}
.body{flex:1;min-height:0;overflow:auto;background:var(--parch);border:4px solid var(--dk);
  box-shadow:inset 4px 4px 0 var(--parch2);padding:14px 16px}
.status{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--wax);display:flex;justify-content:space-between;gap:10px;padding:8px 2px 2px;text-shadow:2px 2px 0 var(--dk)}

.cols{display:grid;grid-template-columns:minmax(200px,240px) 1fr;gap:20px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.info h2{font-family:"Press Start 2P",monospace;font-size:13px;margin:0 0 8px;line-height:1.4;color:var(--dk)}
.info .sub{color:var(--muted);font-size:20px;margin-bottom:12px}
.stat{margin-bottom:10px}
.stat .k{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted);margin-bottom:3px}
.stat .v{font-size:25px}
.bar{display:flex;gap:3px}
.bar i{width:18px;height:14px;background:var(--parch2);border:2px solid var(--dk)}
.bar i.on{background:var(--honey)}
.panel{border:4px solid var(--dk);background:#fff8dc;padding:4px 12px 8px}
.panel h3{font-family:"Press Start 2P",monospace;font-size:9px;margin:6px 0 4px;color:var(--muted)}
.entry{padding:8px 0;border-bottom:3px dotted var(--parch2)}
.entry:last-child{border-bottom:0}
.entry .d{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{background:var(--parch);border:2px solid var(--muted);padding:0 6px;font-size:19px}
.empty{color:var(--muted)}
.btn{font-family:"Press Start 2P",monospace;font-size:10px;cursor:pointer;padding:11px 13px;color:var(--dk);
  background:var(--honey);border:3px solid var(--dk);box-shadow:inset -4px -4px 0 var(--honeydk),inset 4px 4px 0 #ffe27a}
.btn:active{box-shadow:inset 4px 4px 0 var(--honeydk)}
.btn.ghost{background:var(--parch2);box-shadow:inset -4px -4px 0 #cbb57a,inset 4px 4px 0 #fff3cc}
:focus-visible{outline:3px dashed var(--dk);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
form{display:none}
form.open{display:block;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
label{display:block;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;font-family:"VT323",monospace;font-size:21px;background:#fffdf0;color:var(--ink);border-radius:0;padding:4px 7px;
  border:3px solid var(--dk);box-shadow:inset 3px 3px 0 var(--parch2)}
textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;z-index:9;
  font-family:"Press Start 2P",monospace;font-size:10px;background:var(--honey);color:var(--dk);border:3px solid var(--dk);padding:10px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:filter .25s steps(4)}
body.modal #fx,body.modal .wx{filter:blur(5px) brightness(.55)}
.wx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;background:var(--honey);border:4px solid var(--dk);
  box-shadow:inset -4px -4px 0 var(--honeydk),inset 4px 4px 0 #ffe27a,6px 6px 0 #0008;padding:8px 12px 8px 10px;
  font-family:"Press Start 2P",monospace;color:var(--dk);cursor:pointer;user-select:none}
.wx svg{width:32px;height:32px;image-rendering:pixelated;flex:none}
.wx .t{font-size:16px;line-height:1}
.wx .c{font-size:8px;margin-top:6px;color:var(--muted)}
@media (max-height:500px){.wx{padding:5px 8px}.wx svg{width:24px;height:24px}.wx .t{font-size:12px}}

.bdg{cursor:pointer;animation:bob 1.4s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.styl{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:6px;background:var(--wood);border:4px solid var(--dk);padding:6px 8px;box-shadow:6px 6px 0 #0008}
.styl span{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--wax);text-shadow:2px 2px 0 var(--dk);margin-right:4px}
.styl button{font-family:"Press Start 2P",monospace;font-size:10px;width:34px;height:30px;background:var(--parch2);border:3px solid var(--dk);cursor:pointer;padding:0}
.styl button[aria-pressed="true"]{background:var(--honey)}
body.modal .styl{display:none}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.alert{display:flex;align-items:center;gap:8px;background:#fde3d8;border:3px solid #9c2a1a;padding:4px 8px;font-size:20px;color:#6b1a0e}
.alert svg{width:24px;height:24px;flex:none}

.secret{fill:transparent;cursor:default;outline:none}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:3px dotted var(--parch2)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-size:23px}
.set-row .hlp{font-size:18px;color:var(--muted)}
.sw8{position:relative;width:76px;height:34px;flex:none;background:var(--parch2);border:3px solid var(--dk);cursor:pointer;padding:0;
  font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted)}
.sw8::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:22px;background:var(--dk)}
.sw8[aria-checked="true"]{background:var(--honey);color:var(--dk)}
.sw8[aria-checked="true"]::after{left:auto;right:3px}
.sw8 span{position:absolute;top:10px}
.sw8[aria-checked="true"] span{left:9px}.sw8[aria-checked="false"] span{right:7px}

.langs{display:flex;gap:6px;flex:none}
.lb{font-family:"Press Start 2P",monospace;font-size:10px;width:48px;height:34px;background:var(--parch2);color:var(--muted);border:3px solid var(--dk);cursor:pointer;padding:0}
.lb[aria-pressed="true"]{background:var(--honey);color:var(--dk)}
@media (max-width:620px){.set-row{flex-wrap:wrap}}

.inv{display:flex;flex-direction:column}
.inv-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:8px 0;border-bottom:3px dotted var(--parch2)}
.inv-row:last-child{border-bottom:0}
.inv-name{font-size:23px}
.inv-note{font-size:18px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty b{font-family:"Press Start 2P",monospace;font-size:12px;min-width:38px;text-align:center;font-weight:normal}
.sq{font-family:"Press Start 2P",monospace;font-size:12px;width:34px;height:34px;padding:0;cursor:pointer;color:var(--dk);
  background:var(--parch2);border:3px solid var(--dk);box-shadow:inset -3px -3px 0 #cbb57a}
.sq.del{background:#fde3d8;color:#9c2a1a;border-color:#9c2a1a;box-shadow:none}
.inv-head{display:grid;grid-template-columns:1fr auto;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted);padding-bottom:4px}

.styles{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-bottom:10px}
.styles span{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted);margin-right:4px}
.styles .lb{width:36px;height:30px}
.head-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.head-row .k,.s1 .k,.tile .k{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted);margin-bottom:4px;line-height:1.4}
.head-row .v{font-size:24px;display:flex;align-items:center;gap:6px}
.qdot{width:16px;height:16px;border:3px solid var(--dk);display:inline-block}
.panel+.panel,.panel+.actions{margin-top:12px}
.ico{vertical-align:-3px;image-rendering:pixelated}
.tr{display:inline-block;margin-left:4px}
.yn{display:inline-flex;align-items:center;gap:5px}
.warn{background:#fde3d8;outline:3px solid #9c2a1a;outline-offset:-3px}
/* style 1 */
.s1{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.s1-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.s1-grid>div{padding:6px 8px;border:3px solid var(--parch2)}
.bees{display:inline-flex;gap:3px}.bees .off{opacity:.25;filter:grayscale(1)}
.fbar{display:flex;gap:3px;flex-wrap:wrap;margin:4px 0}
.fbar i,.leg i{width:14px;height:34px;border:2px solid var(--dk);display:inline-block}
.leg i{width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.fb{background:#8a4b1c}.ff{background:#f2c230}.fo{background:#e9d9a0;background-image:radial-gradient(#2b1a0c 1px,transparent 1.5px);background-size:5px 5px}.fe{background:transparent}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:19px}
.rate{display:grid;grid-template-columns:160px max-content 1fr;align-items:center;gap:8px;padding:3px 6px;font-size:21px}
.pips{display:inline-flex;gap:3px}.pips i{width:16px;height:16px;border:2px solid var(--dk);background:var(--parch2)}.pips i.on{background:var(--honey)}
/* style 2 */
.s2{width:100%;border-collapse:collapse;font-size:21px}
.s2 th{text-align:left;font-weight:normal;color:var(--muted);width:45%;padding:5px 8px 5px 4px;vertical-align:top}
.s2 td{padding:5px 4px}.s2 tr{border-bottom:2px dotted var(--parch2)}
/* style 3 */
.s3{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:6px 0}
.tile{border:3px solid var(--dk);background:var(--parch);padding:6px 8px;min-height:76px;box-shadow:inset -3px -3px 0 var(--parch2)}
.tile .v{font-family:"Press Start 2P",monospace;font-size:18px;margin-top:6px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tile .v small{font-size:10px;color:var(--muted)}
.tile .sm{font-family:"VT323",monospace;font-size:19px;overflow-wrap:anywhere;line-height:1.1}
.tile.big{grid-column:1/-1;min-height:0}
.trt{width:100%;border-collapse:collapse;font-size:19px}.trt th{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--muted);text-align:left;padding:4px}
.trt td{padding:4px;border-top:2px dotted var(--parch2)}
.hist summary{cursor:pointer;font-family:"Press Start 2P",monospace;font-size:10px;color:var(--leaf);padding:8px 0}
.hist{border-bottom:3px dotted var(--parch2)}
form.mini{display:none}form.mini.open{display:block;margin-top:8px}
.hlp{font-size:18px;color:var(--muted);margin:8px 0 0}
@media (max-width:620px){.head-row{grid-template-columns:1fr 1fr}.rate{grid-template-columns:1fr auto auto}}

.bees{align-items:center}.bees .half{display:inline-block;width:15px;overflow:hidden}.bnum{font-family:"Press Start 2P",monospace;font-size:11px;margin-left:8px;font-weight:normal}
.frow{display:grid;grid-template-columns:110px max-content 28px 1fr;align-items:center;gap:8px;font-size:20px;margin:3px 0}
.frow b{font-family:"Press Start 2P",monospace;font-size:11px;font-weight:normal;text-align:right}
.frow .fbar{margin:0}.frow .fbar i{height:22px;width:13px}
.dash{font-size:22px;color:var(--muted)}
.sub-h{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--dk);margin:12px 0 6px;padding-top:8px;border-top:3px dotted var(--parch2)}
.panel h3+.sub-h{border-top:0;padding-top:0;margin-top:4px}
.wt-now{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.wt-now .big{font-family:"Press Start 2P",monospace;font-size:20px;margin-top:6px}
.wt-now .k{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted)}
.lr{display:flex;gap:16px;font-size:21px}
.wchart{display:flex;gap:10px;align-items:flex-end;height:150px;padding:8px 4px 0;border-bottom:3px solid var(--dk);overflow-x:auto}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:56px}
.wbar{width:30px;background:var(--honey);border:3px solid var(--dk);display:flex;flex-direction:column;justify-content:flex-end;min-height:6px;max-height:80px}
.wbar i{display:block;background:var(--honeydk)}
.wcol b{font-family:"Press Start 2P",monospace;font-size:9px;font-weight:normal;margin-top:4px}
.wcol small{font-size:15px;color:var(--muted);line-height:1}
@media (max-width:620px){.frow{grid-template-columns:80px max-content 24px 1fr}}
.hi{color:#9c2a1a;font-weight:bold}.treated{font-size:16px;color:var(--leaf)}
.pips i.half{background:linear-gradient(90deg,var(--honey) 50%,var(--parch2) 50%)}
.rate .num{font-family:"Press Start 2P",monospace;font-size:10px;margin-left:8px}
.fbar i.hf{background-image:linear-gradient(90deg,transparent 50%,#fff8dc 50%)}
.fbar i.fo.hf{background-image:linear-gradient(90deg,transparent 50%,#fff8dc 50%),radial-gradient(#2b1a0c 1px,transparent 1.5px);background-size:100% 100%,5px 5px}

.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{font-family:"Press Start 2P",monospace;font-size:9px;padding:10px 10px;cursor:pointer;background:var(--parch2);color:var(--muted);border:3px solid var(--dk)}
.tab[aria-selected="true"]{background:var(--honey);color:var(--dk)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp-row{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px;font-size:20px}
.cn{display:flex;align-items:center;gap:6px}.sw2{width:12px;height:12px;border:2px solid var(--dk);display:inline-block;flex:none}
.cbar{display:flex;height:18px;border:3px solid var(--dk);background:var(--parch2)}
.cbar .cl{background:var(--honeydk)}.cbar .cr{background:var(--honey)}
.cv{font-family:"Press Start 2P",monospace;font-size:10px;text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
.plants{display:flex;flex-direction:column}
.plant{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:3px dotted var(--parch2);font-size:21px}
.plant:last-child{border-bottom:0}
.tags{display:flex;gap:4px;flex:none}
.tg{font-style:normal;font-family:"Press Start 2P",monospace;font-size:7px;padding:4px 5px;border:2px solid var(--dk)}
.tg.n{background:var(--honey)}.tg.p{background:#e8a03a}.tg.h{background:#8a6b3a;color:#fff}
.src{display:flex;flex-direction:column;padding:6px 0;border-bottom:3px dotted var(--parch2)}
.src a{color:var(--dk);font-size:21px}.src small{font-size:16px;color:var(--muted)}
@media (max-width:620px){.cmp-row{grid-template-columns:80px 1fr 90px}}

body.modal.carmode #track{filter:none}
body.carmode .backdrop{justify-content:flex-start}
body.carmode .shadow{width:min(460px,100%)}
body.carmode .body{padding:10px 12px}
body.carmode .cmp-row{grid-template-columns:96px 1fr 86px;gap:6px;font-size:19px}
body.carmode .status span:last-child{display:none}
body.carmode #wx{display:none}

.pq{padding:8px 0 10px;border-bottom:3px dotted var(--parch2)}.pq:last-child{border-bottom:0}
.pq-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:21px}
.pq-top b{font-family:"Press Start 2P",monospace;font-size:11px;font-weight:normal}
.pq-from{font-size:19px;color:var(--muted);margin:2px 0 6px}
.pq-sc .k{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--muted)}
.pq .rate{grid-template-columns:130px max-content 1fr}
.pqtag{display:inline-block;font-family:"Press Start 2P",monospace;font-size:7px;background:var(--honey);border:2px solid var(--dk);padding:3px 5px;margin-bottom:4px}
.titlebar,.status{flex:none}
.pqtag.split{background:#bfe3b0}

const PIX={
 pq:["..bb....bb..","..bbb..bbb..","...bbbbbb...","....bbbb....","...kkkkkk...","..kyyyyyyk..",".kyyyooyyyk.",".kyyooooyyk.",".kyyyooyyyk.","..kyyyyyyk..","...kkkkkk...","............"],
 queen:[".k...kk...k.","kyk.kyyk.kyk","kyykkyykkyyk","kyyyyyyyyyyk","kyryyyyyyryk","kyyyyRyyyyyk","kooooooooook","kooooooooook","kkkkkkkkkkkk","............"],
 sting:["..ww....ww..",".www.kk.www.","..wkyyyyk...","..kkkkkkkk..","..yyyyyyyy..","..kkkkkkkk..","...yyyyyy...","...kkkkkk...","....yyyy....",".....kk.....",".....kk.....","......k....."],
 mite:["............","..k......k..","...k.rr.k...","k..rrrrrr..k",".krrRrrRrrk.","k.rrrrrrrr.k",".krrrrrrrrk.","k..rrrrrr..k","...k.rr.k...","..k......k..","............"]};
const PC={b:"#2f63d6",y:"#f2c230",o:"#c98a1a",r:"#8a2a14",R:"#d24a2a",k:"#2b1a0c",w:"#e8f4ff"};
function pix(name,x,y,s){const m=PIX[name];const H=m.length;
  return `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 ${(H-12)/2} 12 12" shape-rendering="crispEdges">`+
  m.map((r,j)=>[...r].map((c,i)=>c==="."?"":`<rect x="${i}" y="${j}" width="1.02" height="1.02" fill="${PC[c]}"/>`).join("")).join("")+`</svg>`}
function notch(x,y,w,h,n){return `${x},${y+n} ${x+n},${y+n} ${x+n},${y} ${x+w-n},${y} ${x+w-n},${y+n} ${x+w},${y+n} ${x+w},${y+h-n} ${x+w-n},${y+h-n} ${x+w-n},${y+h} ${x+n},${y+h} ${x+n},${y+h-n} ${x},${y+h-n}`}
let bstyle=3;const bLayer=document.createElementNS(NS,"g");scene.appendChild(bLayer);
function drawBadges(){
  bLayer.innerHTML="";
  HIVES.forEach(h0=>{ const h={...h0,flags:[...(SET.badges?flagsFor(h0.n):[]),...(SET.pq&&PRUEF[h0.n]?["pq"]:[])]}; if(!h.flags.length)return;
    const [x,y,w]=h.box,cxm=x+w/2,S=bstyle===3?40:58,G=bstyle===3?5:8,n=h.flags.length;let s="";
    if(bstyle===1){ // round coins
      const tw=n*S+(n-1)*G;let bx=cxm-tw/2;const by=y-S-26;
      h.flags.forEach(f=>{s+=`<polygon points="${notch(bx,by,S,S,12)}" fill="#2b1a0c"/><polygon points="${notch(bx+5,by+5,S-10,S-10,8)}" fill="#fff1c2"/>`+pix(f,bx+9,by+9,S-18);bx+=S+G});
    } else if(bstyle===2){ // red alert bubble
      const P=10,tw=n*(S-10)+(n-1)*4+P*2+34,bh=S+4;const bx=cxm-tw/2,by=y-bh-40;
      s+=`<polygon points="${notch(bx,by,tw,bh,8)}" fill="#9c2a1a"/><polygon points="${notch(bx+5,by+5,tw-10,bh-10,5)}" fill="#fffdf0"/>`+
         `<rect x="${cxm-10}" y="${by+bh-1}" width="20" height="10" fill="#9c2a1a"/><rect x="${cxm-4}" y="${by+bh+9}" width="8" height="8" fill="#9c2a1a"/>`+
         `<rect x="${bx+P+6}" y="${by+12}" width="9" height="24" fill="#d22"/><rect x="${bx+P+6}" y="${by+40}" width="9" height="9" fill="#d22"/>`;
      let ix=bx+P+26;h.flags.forEach(f=>{s+=pix(f,ix,by+7,S-10);ix+=S-6});
    } else { // yellow warning plates like the sign
      const tw=n*S+(n-1)*G;let bx=cxm-tw/2;const by=y-S-18;
      h.flags.forEach(f=>{s+=`<rect x="${bx}" y="${by}" width="${S}" height="${S}" fill="#2b1a0c"/><rect x="${bx+4}" y="${by+4}" width="${S-8}" height="${S-8}" fill="${f==="pq"?"#dbe8ff":"#f2c230"}"/>`+
        `<rect x="${bx+4}" y="${by+S-8}" width="${S-8}" height="4" fill="#b8860b"/><rect x="${bx+4}" y="${by+4}" width="${S-8}" height="3" fill="#ffe27a"/>`+pix(f,bx+6,by+6,S-12);bx+=S+G});
    }
    const g=document.createElementNS(NS,"g");g.setAttribute("class","bdg");g.innerHTML=s;
    g.style.animationDelay=(h.n*0.13)+"s";g.addEventListener("click",()=>openHive(h.n));bLayer.appendChild(g);
  });
}

function openBox(keepForm){

       ${ctl}
       ${fixed?"<span></span>":`<button class="sq del" data-d="${i}" aria-label="${t.remove}: ${esc(it.n)}" title="${t.remove}">X</button>`}</div>`}).join(""):`<p class="empty">${t.invEmpty}</p>`}</div>
   </div>

function setScene(img,mode){curImg=img;$("bgimg").setAttribute("href",IMG[img]);boxLid(openView&&openView[0]==="box");$("bgmead").setAttribute("href",IMGM[img]);fxMode=mode;initFx()}
function applyWeather(code,temp){
  const s=seasonNow();let img=s,mode="none",ic="sun",txt="sun";
  const rain=(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95, snow=(code>=71&&code<=77)||code===85||code===86;
  if(snow){img="winter";mode="snow";ic="snow";txt="snow"}
  else if(rain){img="rain";mode="rain";ic="rain";txt=code>=95?"storm":"rain"}
  else if(code>=1&&code<=48){ic="cloud";txt=code<=2?"part":code===3?"cloud":"fog"}
  setScene(img,mode);icon(ic);WX={temp,txt};renderWx();
}
let WX={temp:null,txt:"sun"},offline=false;
function renderWx(){$("wxt").textContent=WX.temp==null?"--°C":Math.round(WX.temp)+"°C";
  $("wxc").textContent=T().city+", "+(offline&&WX.temp==null?T().wx.pre:T().wx[WX.txt])}
// particles
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function initFx(){cv.width=Math.ceil(innerWidth/3);cv.height=Math.ceil(innerHeight/3);cv.style.imageRendering="pixelated";
  const n=fxMode==="rain"?140:fxMode==="snow"?110:0;
  parts=Array.from({length:n},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,v:fxMode==="rain"?3+Math.random()*2:.3+Math.random()*.5,p:Math.random()*6}));
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  for(const q of parts){
    if(fxMode==="rain"){cx.fillStyle="#cfe3ffaa";cx.fillRect(q.x|0,q.y|0,1,4);q.y+=q.v;q.x-=q.v*.15}
    else{cx.fillStyle="#fff";cx.fillRect(q.x|0,q.y|0,q.p>3?2:1,q.p>3?2:1);q.y+=q.v;q.x+=Math.sin((q.y+q.p*10)/12)*.3}
    if(q.y>cv.height){q.y=-5;q.x=Math.random()*cv.width} if(q.x<0)q.x+=cv.width}
  raf=still?null:requestAnimationFrame(tick)}
addEventListener("resize",initFx);

  o["wt:"+n]=JSON.stringify(DB.wt[n]||[]);o["wash:"+n]=JSON.stringify(DB.wash[n]||[])}o.inv=JSON.stringify(inv);o.obs=JSON.stringify(OBS);return o}

  for(let n=1;n<=9;n++){[["insp",DB.insp],["tr",DB.tr],["wt",DB.wt],["wash",DB.wash]].forEach(([p,o])=>{const v=g(p+":"+n);if(v)o[n]=v})}
  const i=g("inv");if(Array.isArray(i))inv=i;const b=g("obs");if(Array.isArray(b))OBS=b;
  try{localStorage.setItem("beeyard19",JSON.stringify(DB));localStorage.setItem("beeyard-inv2",JSON.stringify(inv));localStorage.setItem("beeyard-obs",JSON.stringify(OBS))}catch(e){}}
function queueSync(){if(!API_URL||!remoteReady)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,700)}
async function pushSync(){const now=pack(),set={};Object.keys(now).forEach(k=>{if(now[k]!==lastSynced[k])set[k]=now[k]});
  if(!Object.keys(set).length)return;syncState="busy";showSync();
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({set})});
    const j=await r.json();if(!j.ok)throw new Error(j.error);Object.assign(lastSynced,set);syncState="ok"}
  catch(e){syncState="off";setTimeout(queueSync,15000)}showSync()}
async function loadRemote(){if(!API_URL)return;
  try{const r=await fetch(API_URL);const j=await r.json();if(!j.ok)throw 0;const d=j.data||{};
    const empty=!Object.keys(d).length;if(!empty){unpack(d);lastSynced={...d}}remoteReady=true;syncState="ok";
    drawBadges();const v=openView;if(v){if(v[0]==="hive")openHive(v[1]);else if(v[0]==="box")openBox();else if(v[0]==="car")openCar()}
    if(empty)pushSync();   // first run: upload the current data
  }catch(e){syncState="off";setTimeout(loadRemote,20000)}showSync()}
const _sDB=saveDB,_sInv=saveInv,_sObs=saveObs;
saveDB=function(){_sDB();queueSync()};saveInv=function(){_sInv();queueSync()};saveObs=function(){_sObs();queueSync()};
loadRemote();

applyLang();go(0);
</script>
